server.port=8082
spring.datasource.url=jdbc:h2:mem:productiondb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123
spring.rabbitmq.connection-timeout=2s
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.retry.instances.atelier-service.max-attempts=3
resilience4j.retry.instances.atelier-service.wait-duration=500ms
resilience4j.retry.instances.atelier-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.retry.instances.utilisateurs-service.max-attempts=3
resilience4j.retry.instances.utilisateurs-service.wait-duration=500ms
resilience4j.retry.instances.utilisateurs-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.atelier-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.atelier-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.atelier-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.atelier-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.atelier-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.atelier-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.atelier-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.atelier-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.utilisateurs-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.utilisateurs-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.utilisateurs-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.utilisateurs-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.utilisateurs-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.utilisateurs-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.utilisateurs-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.utilisateurs-service.automatic-transition-from-open-to-half-open-enabled=true
